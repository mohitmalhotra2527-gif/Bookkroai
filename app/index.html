<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BookKaro Sarthi — Namaste! 🙏</title>
<meta name="description" content="BookKaro Sarthi — AI railway assistant. Bolkar ya type karke poochho: trains, live status, fare, PNR. Hindi, Hinglish, English." />
<meta name="theme-color" content="#FFF8EF" />
<link rel="preload" as="image" href="assets/assistant-concierge.png" />
<style>
  :root {
    --orange:   #F56B2A;
    --orange-2: #F97332;
    --orange-deep: #EA580C;
    --navy:     #142B3D;
    --cream:    #FFF8EF;
    --cream-2:  #FFF9F2;
    --offwhite: #FCFAF6;
    --teal:     #159889;
    --gold:     #F3C744;
    --coral:    #F26B4A;
    --line:     #E8E1D8;
    --muted:    #8A9298;
    --navh: 62px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Noto Sans", "Noto Sans Devanagari", sans-serif;
    background:
      radial-gradient(900px 460px at 14% -8%, rgba(245,107,42,.10), transparent 60%),
      radial-gradient(800px 460px at 90% 110%, rgba(21,152,137,.10), transparent 60%),
      var(--offwhite);
    color: var(--navy);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .i { width: 20px; height: 20px; flex: 0 0 auto; }
  .i.sm { width: 15px; height: 15px; }
  :focus-visible { outline: 2.5px solid var(--orange); outline-offset: 2px; border-radius: 10px; }

  .shell {
    max-width: 980px; margin-inline: auto;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: 0 0 calc(var(--navh) + 26px);
  }

  /* ── header ── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  .mark {
    width: 42px; height: 42px; border-radius: 13px; flex: 0 0 auto;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(150deg, #FB923C, var(--orange) 55%, var(--orange-deep));
    box-shadow: 0 6px 16px rgba(234,88,12,.32), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(21,152,137,.16); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .ask-ai {
    border: 0; cursor: pointer; border-radius: 999px; padding: 9px 16px;
    font-size: 13px; font-weight: 750; color: #fff; letter-spacing: .1px;
    background: linear-gradient(150deg, #FB923C, var(--orange) 55%, var(--orange-deep));
    box-shadow: 0 6px 16px rgba(234,88,12,.35), inset 0 1px 0 rgba(255,255,255,.4);
    display: inline-flex; align-items: center; gap: 7px; transition: transform .12s;
  }
  .ask-ai:active { transform: scale(.96); }
  .avatar-btn {
    width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto; border: 0; cursor: pointer;
    display: grid; place-items: center; color: #7C2D12;
    background: linear-gradient(150deg, #FFEDD5, #FDBA74);
    border: 1.5px solid #fff; box-shadow: 0 3px 10px rgba(20,43,61,.16);
  }

  /* ── stage: avatar + bubble ── */
  .stage {
    display: grid; grid-template-columns: 40% 60%; align-items: center; gap: 20px;
    padding: 32px 30px; position: relative; min-height: 420px;
    background: var(--cream);
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background:
      radial-gradient(60% 70% at 80% 16%, rgba(245,107,42,.12), transparent 60%),
      linear-gradient(160deg, var(--cream-2), var(--cream));
  }
  .avatar-wrap { position: relative; z-index: 2; display: flex; justify-content: center; }
  .avatar-ring {
    position: relative; width: min(290px, 88%); aspect-ratio: 1/1.12;
    border-radius: 26px; overflow: hidden;
    background: #fff; border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(20,43,61,.16);
  }
  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-ring img.pose { object-fit: contain; }
  .avatar-ring.speaking::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 26px;
    box-shadow: 0 0 0 3px var(--orange), 0 0 44px rgba(245,107,42,.5);
    animation: speakglow 1.2s ease-in-out infinite;
  }
  @keyframes speakglow { 0%,100% { opacity: .5; }
  /* ── avatar gestures + Hindi subtitle ── */
  .avatar-ring { cursor: pointer; }
  .avatar-ring img.pose {
    position: absolute; inset: 0; opacity: 0;
    transition: opacity .34s ease, transform 1.1s cubic-bezier(.4,0,.6,1);
  }
  .avatar-ring img.pose.on { opacity: 1; }
  .avatar-ring[data-g="1"] img.pose.on { transform: translateY(-1.4%) scale(1.016); }
  .avatar-ring[data-g="2"] img.pose.on { transform: translateY(.5%) scale(.995); }
  .avatar-ring.breath img.pose.on { animation: breathe 3.6s ease-in-out infinite alternate; }
  @keyframes breathe { from { scale: 1 1; } to { scale: 1.008 1.012; } }
  .sub-hi {
    margin-top: 10px; padding: 9px 14px; border-radius: 14px;
    background: rgba(245,107,42,.10); border: 1px solid rgba(245,107,42,.3);
    font-family: "Noto Sans Devanagari", "Noto Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(12px, 1.5vw, 15px); line-height: 1.85; color: var(--navy);
  }
  .sub-hi b { color: var(--orange-deep); font-weight: 700; }
  .sub-hi .tag {
    font-size: 10.5px; font-weight: 800; color: var(--orange-deep);
    background: #fff; border: 1px solid rgba(245,107,42,.35); border-radius: 999px;
    padding: 1px 8px; margin-right: 8px; vertical-align: 2px;
  }
 50% { opacity: 1; } }
  .badge {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px; z-index: 3;
    background: #fff; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; font-size: 11px; font-weight: 800; letter-spacing: .4px;
    color: var(--orange-2); box-shadow: 0 8px 20px rgba(20,43,61,.12); white-space: nowrap;
  }

  .conv { position: relative; z-index: 2; min-width: 0; }
  .who { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 6px 8px; letter-spacing: .2px; }
  .bubble {
    background: #fff; border-radius: 26px; border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(20,43,61,.13);
    padding: 24px 26px; position: relative;
    display: flex; flex-wrap: wrap; align-items: baseline;
    column-gap: 0.55ch; row-gap: 8px;
  }
  .bubble::before {
    content: ""; position: absolute; left: -11px; top: 30px;
    width: 20px; height: 20px; background: #fff; border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line); transform: rotate(45deg);
  }
  .bubble .line {
    font-size: clamp(19px, 2.4vw, 28px); font-weight: 800; letter-spacing: -.4px; line-height: 1.32;
    display: inline;
  }
  .bubble .hl { color: var(--orange-2); }
  .caret {
    display: inline-block; width: 3px; height: .95em; background: var(--orange);
    margin-left: 2px; vertical-align: -0.08em; border-radius: 2px;
    animation: blink .8s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .controls { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .play {
    border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(150deg, #FB923C, var(--orange) 55%, var(--orange-deep)); color: #fff;
    border-radius: 999px; padding: 12px 22px; font-size: 14.5px; font-weight: 800;
    box-shadow: 0 10px 24px rgba(234,88,12,.38), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s;
  }
  .play:active { transform: scale(.96); }
  .play.playing { background: linear-gradient(150deg, #6b7280, #4b5563); box-shadow: 0 8px 18px rgba(75,85,99,.3); }
  .replay {
    border: 1px solid var(--line); cursor: pointer; border-radius: 999px; padding: 11px 18px;
    background: #fff; font-size: 13.5px; font-weight: 700; color: var(--navy);
    box-shadow: 0 4px 12px rgba(20,43,61,.08);
  }
  .hint { font-size: 12px; color: var(--muted); font-weight: 600; flex-basis: 100%; }

  /* ── composer ── */
  .composer {
    margin: -20px 30px 0; position: relative; z-index: 5;
    background: #fff; border-radius: 22px; border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(20,43,61,.12); padding: 14px 14px 13px;
  }
  .composer-label { font-size: 13px; font-weight: 800; letter-spacing: -.1px; color: var(--navy); margin: 0 4px 10px; }
  .c-row { display: flex; align-items: center; gap: 9px; }
  .c-field {
    flex: 1; min-width: 0; display: flex; align-items: center;
    background: var(--cream); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 4px 6px 4px 16px; transition: border-color .15s, box-shadow .15s;
  }
  .c-field:focus-within { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(245,107,42,.14); }
  .c-field input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-size: 13.5px; padding: 9px 0; color: var(--navy);
  }
  .c-field input::placeholder { color: var(--muted); }
  .mic {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto; cursor: pointer;
    border: 2px solid var(--orange); background: #fff; display: grid; place-items: center;
    color: var(--orange-2); transition: transform .12s;
  }
  .mic:active { transform: scale(.93); }
  .send {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto; cursor: pointer;
    border: 0; display: grid; place-items: center; color: #fff;
    background: linear-gradient(150deg, #FB923C, var(--orange) 55%, var(--orange-deep));
    box-shadow: 0 7px 18px rgba(234,88,12,.38), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s;
  }
  .send:active { transform: scale(.93); }
  .composer-hint { margin: 9px 6px 0; font-size: 11px; font-weight: 650; color: var(--muted); }
  .composer-hint b { color: var(--orange-2); }

  /* ── quick prompts ── */
  .prompts { display: flex; gap: 9px; margin: 16px 30px 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .prompts::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    background: #fff; color: var(--navy); border-radius: 999px;
    padding: 9px 15px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(20,43,61,.05); transition: transform .12s, box-shadow .15s, border-color .15s;
  }
  .chip .i { color: var(--orange-2); }
  .chip:hover { border-color: #F5CFA9; box-shadow: 0 6px 16px rgba(20,43,61,.1); }
  .chip:active { transform: scale(.96); }

  /* ── bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 50;
    width: min(980px, 100%);
    display: flex; align-items: stretch;
    height: calc(var(--navh) + env(safe-area-inset-bottom));
    padding: 7px 14px calc(7px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); backdrop-filter: blur(16px) saturate(150%);
    border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(20,43,61,.08);
  }
  .bn-item {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .1px;
    border-radius: 14px; transition: color .15s;
  }
  .bn-item .bn-ico { line-height: 1; display: grid; place-items: center; }
  .bn-item[aria-current="page"] { color: var(--orange-deep); }
  .bn-item[aria-current="page"] .bn-ico { background: #FFE4C7; border-radius: 12px; padding: 3px; }

  @media (max-width: 720px) {
    .stage { grid-template-columns: 1fr; padding: 24px 20px; }
    .avatar-ring { width: 210px; }
    .bubble::before { display: none; }
    .composer { margin: 12px 16px 0; }
    .prompts { margin: 14px 16px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="shell">
  <header class="topbar">
    <span class="mark" aria-hidden="true"><svg class="i"><use href="#i-train"/></svg></span>
    <span>
      <span class="brand">BookKaro Sarthi</span>
      <span class="status"><i aria-hidden="true"></i>Online</span>
    </span>
    <div class="top-right">
      <button class="ask-ai" id="ask-ai" type="button"><svg class="i sm" aria-hidden="true"><use href="#i-spark"/></svg>Ask AI</button>
      <button class="avatar-btn" type="button" aria-label="Profile"><svg class="i"><use href="#i-user"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <div class="avatar-wrap">
      <div class="avatar-ring" id="avatar">
      <img class="pose on" data-g="0" src="assets/pose-1-namaste.jpg" alt="BookKaro Sarthi assistant greeting with folded hands" fetchpriority="high" decoding="async" />
      <img class="pose" data-g="1" src="assets/pose-2-present.jpg" alt="" aria-hidden="true" decoding="async" loading="lazy" />
      <img class="pose" data-g="2" src="assets/pose-3-question.jpg" alt="" aria-hidden="true" decoding="async" loading="lazy" />
      </div>
      <span class="badge">BookKaro Sarthi</span>
    </div>

    <div class="conv">
      <div class="who">BookKaro Sarthi</div>
      <div class="bubble">
        <div class="line"><span class="hl">Namaste! 🙏</span></div>
        <div class="line">Main <span class="hl">BookKaro Sarthi</span> hoon.</div>
        <div class="line">Bataiye, main aapki kaise madad kar sakti hoon?</div>
      </div>
    </div>
  </main>

  <section class="composer" aria-label="Ask BookKaro Sarthi">
    <div class="composer-label">Ask BookKaro Sarthi anything about your journey</div>
    <form class="c-row" id="form">
      <label class="sr" for="query">Ask BookKaro Sarthi anything about your journey</label>
      <div class="c-field">
        <input id="query" name="query" type="text" autocomplete="off" spellcheck="false"
               enterkeyhint="send" placeholder="Kal Amritsar se Delhi jaana hai..." />
      </div>
      <button class="mic" id="mic" type="button" aria-label="Voice" title="Bolkar poochho"><svg class="i"><use href="#i-mic"/></svg></button>
      <button class="send" type="submit" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
    </form>
    <div class="composer-hint"><b>Bolkar</b> ya type karke poochho.</div>
  </section>

  <div class="prompts" aria-label="Quick prompts">
    <button class="chip" type="button" data-q="Kal Amritsar se Delhi jaana hai"><svg class="i sm" aria-hidden="true"><use href="#i-train"/></svg>Find a train</button>
    <button class="chip" type="button" data-q="12014 ka live status batao"><svg class="i sm" aria-hidden="true"><use href="#i-pin"/></svg>Live status</button>
    <button class="chip" type="button" data-q="Kaunsi train fastest hai?"><svg class="i sm" aria-hidden="true"><use href="#i-bolt"/></svg>Fastest train</button>
    <button class="chip" type="button" data-q="12014 ka fare batao"><svg class="i sm" aria-hidden="true"><use href="#i-rupee"/></svg>Check fare</button>
    <button class="chip" type="button" data-q="Mera PNR check karo"><svg class="i sm" aria-hidden="true"><use href="#i-ticket"/></svg>Check PNR</button>
    <button class="chip" type="button" data-q="RAC aur WL kya hota hai?"><svg class="i sm" aria-hidden="true"><use href="#i-chat"/></svg>Railway questions</button>
  </div>
</div>

<nav class="bottom-nav" aria-label="App navigation">
  <button class="bn-item" type="button" aria-current="page" data-nav="home"><span class="bn-ico"><svg class="i"><use href="#i-home"/></svg></span>Home</button>
  <button class="bn-item" type="button" data-go="chat.html"><span class="bn-ico"><svg class="i"><use href="#i-chat"/></svg></span>Chat</button>
  <button class="bn-item" type="button" data-go="chat.html"><span class="bn-ico"><svg class="i"><use href="#i-ticket"/></svg></span>My Bookings</button>
  <button class="bn-item" type="button" data-go="chat.html"><span class="bn-ico"><svg class="i"><use href="#i-wallet"/></svg></span>Wallet</button>
</nav>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ── hand the question to the chat flow ── */
  var input = $('query'), form = $('form');
  function go(q) {
    location.href = q ? 'chat.html?q=' + encodeURIComponent((q || '').slice(0, 300)) : 'chat.html';
  }
  function submitQuery(q) {
    q = (q || '').trim();
    if (!q) { input.focus(); return; }
    go(q);
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); submitQuery(input.value); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(input.value); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'), function (el) {
    el.addEventListener('click', function () { submitQuery(el.getAttribute('data-q') || ''); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (el) {
    el.addEventListener('click', function () { location.href = el.getAttribute('data-go'); });
  });
  $('ask-ai').addEventListener('click', function () { go(input.value); });
  $('mic').addEventListener('click', function () { input.focus(); });
})();
</script>
</body>
</html>
